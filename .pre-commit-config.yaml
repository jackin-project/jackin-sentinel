repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        files: ^(probe/jackin-sentinel-probe|hooks/[^/]+\.sh)$
      - id: shfmt
        name: shfmt
        language: system
        entry: shfmt -d -i 4 -ci
        files: ^(probe/jackin-sentinel-probe|hooks/[^/]+\.sh)$
      - id: hadolint
        name: hadolint
        language: system
        entry: hadolint
        files: ^Dockerfile$
