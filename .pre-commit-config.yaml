repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        language: system
        entry: sh -c 'for file; do gitleaks dir --redact --no-banner "$file" || exit 1; done' gitleaks
      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        files: ^(probe/jackin-sentinel-probe|probe/tests/[^/]+\.sh|hooks/[^/]+\.sh)$
      - id: shfmt
        name: shfmt
        language: system
        entry: shfmt -d -i 4 -ci
        files: ^(probe/jackin-sentinel-probe|probe/tests/[^/]+\.sh|hooks/[^/]+\.sh)$
      - id: hadolint
        name: hadolint
        language: system
        entry: hadolint
        files: ^Dockerfile$
      - id: probe-j08
        name: probe J08 cases
        language: system
        entry: sh probe/tests/j08.sh
        files: ^probe/(jackin-sentinel-probe|tests/j08\.sh)$
        pass_filenames: false
      - id: hooks-setup
        name: setup hook cases
        language: system
        entry: sh probe/tests/hooks.sh
        files: ^(hooks/setup\.sh|probe/tests/hooks\.sh)$
        pass_filenames: false
      - id: probe-egress
        name: probe egress cases
        language: system
        entry: sh probe/tests/egress.sh
        files: ^probe/(jackin-sentinel-probe|tests/egress\.sh)$
        pass_filenames: false
