schema = 1

[role]
name = "sentinel"
dockerfile = "Dockerfile"
policy = "policy.yaml"

[docker]
enabled = false

[hooks]
setup = "hooks/setup.sh"
preflight = "hooks/preflight.sh"

[env.SENTINEL_FAIL_PREFLIGHT]
default = "0"
prompt = "Fail the preflight hook (1) or pass it (0):"

[agents.codex]
instructions = "instructions/codex.md"

[agents.omp]
model = "glm-5.3"
instructions = "instructions/omp.md"

[agents.claude]
instructions = "instructions/claude.md"
