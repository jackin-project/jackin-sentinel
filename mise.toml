[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
hadolint = "2.15.1"
prek = "0.5.3"
python = "3.14.7"
shellcheck = "0.11.0"
shfmt = "3.14.1"
uv = "0.12.17"
"pipx:reuse" = { version = "6.2.0", extras = "charset-normalizer", depends = ["python"] }

[settings]
lockfile = true

[tasks.test]
description = "Run the repository test gate"
run = "prek run --all-files"
